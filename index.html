<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 할 일 목록</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-card">
        <h1 class="title">나의 할 일 목록</h1>

        <!-- 할 일 입력 영역 -->
        <form id="todo-form" class="todo-form">
            <input id="todo-input" class="todo-input" type="text"
                   placeholder="할 일을 입력하세요" aria-label="할 일" autocomplete="off">
            <button id="add-btn" class="btn-add" type="submit">추가</button>
        </form>

        <!-- 할 일 개수 표시 -->
        <p class="todo-summary" aria-live="polite">
            전체 <strong id="total-count">0</strong>개, 완료 <strong id="done-count">0</strong>개
        </p>

        <!-- 필터 버튼 + 완료 항목 일괄 삭제 -->
        <div class="todo-toolbar">
            <div id="filters" class="filters" role="group" aria-label="할 일 필터">
                <button class="btn-filter active" type="button" data-filter="all" aria-pressed="true">전체</button>
                <button class="btn-filter" type="button" data-filter="active" aria-pressed="false">진행중</button>
                <button class="btn-filter" type="button" data-filter="completed" aria-pressed="false">완료</button>
            </div>
            <button id="clear-completed" class="btn-clear" type="button" disabled>완료된 항목 삭제</button>
        </div>

        <!--
            할 일 목록 영역
            항목은 main.js가 아래 구조로 그린다. 완료된 항목에는 completed 클래스를 붙인다.

            <li class="todo-item completed">
                <input class="todo-check" type="checkbox" checked>
                <span class="todo-text">할 일 내용</span>
                <button class="btn-delete" type="button" aria-label="삭제">×</button>
            </li>
        -->
        <ul id="todo-list" class="todo-list" data-empty="아직 할 일이 없습니다"></ul>
    </main>

    <script src="main.js"></script>
</body>
</html>
